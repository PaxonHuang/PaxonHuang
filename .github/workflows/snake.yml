name: generate contribution snake animation

on:
  # Run once per day at 00:00 UTC. The snake reflects GitHub activity,
  # not repo contents, so a daily refresh is enough for the profile.
  schedule:
    - cron: "0 0 * * *"

  # Allow manual regeneration from the Actions tab.
  workflow_dispatch:

  # NOTE: `push` trigger was removed because Cloudflare Pages now builds
  # from `main` for the production site. The snake workflow previously
  # also fired on every blog deploy, which was unnecessary noise.
  # Triggers: schedule (daily) and manual only.

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake SVG from contribution grid
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: PaxonHuang
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
